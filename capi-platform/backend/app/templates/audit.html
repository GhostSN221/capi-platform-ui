{% extends "base.html" %}
{% block content %}
<div class="row">
    <h1 id="title">Journal d'audit</h1>
    <button class="btn-outline" onclick="load()">&#8635; Actualiser</button>
</div>
<div id="empty" class="empty" style="display:none">Aucune entrée dans le journal.</div>
<div class="card" style="padding:0">
    <table id="audit-table">
        <thead><tr>
            <th>Date</th>
            <th>Utilisateur</th>
            <th>Action</th>
            <th>Ressource</th>
            <th>Détails</th>
        </tr></thead>
        <tbody id="audit-body">
            <tr><td colspan="5" style="text-align:center;color:#94a3b8;padding:32px">Chargement…</td></tr>
        </tbody>
    </table>
</div>
{% endblock %}

{% block scripts %}
<script>
    if (!requireAuth()) {}
    loadNavUser();

    const ACTION_BADGE = {
        create:  'badge-ready',
        delete:  'badge-error',
        scale:   'badge-provisioning',
        upgrade: 'badge-provisioning',
    };

    async function load() {
        try {
            const entries = await api.getAuditLog();
            document.getElementById('title').textContent = `Journal d'audit (${entries.length})`;
            const tbody = document.getElementById('audit-body');
            const empty = document.getElementById('empty');
            const table = document.getElementById('audit-table');
            if (entries.length === 0) {
                table.style.display = 'none';
                empty.style.display = '';
                return;
            }
            table.style.display = '';
            empty.style.display = 'none';
            tbody.innerHTML = entries.map(e => {
                const cls = ACTION_BADGE[e.action] || 'badge-default';
                const ts  = new Date(e.created_at).toLocaleString('fr-FR');
                return `<tr>
                    <td style="white-space:nowrap;font-size:13px">${ts}</td>
                    <td style="font-weight:500">${e.username}</td>
                    <td><span class="badge ${cls}">${e.action}</span></td>
                    <td>${e.resource}</td>
                    <td style="color:#64748b;font-size:13px">${e.details || '—'}</td>
                </tr>`;
            }).join('');
        } catch (e) {
            document.getElementById('audit-body').innerHTML =
                `<tr><td colspan="5" style="text-align:center;color:#dc2626;padding:24px">${e}</td></tr>`;
        }
    }

    load();
</script>
{% endblock %}
