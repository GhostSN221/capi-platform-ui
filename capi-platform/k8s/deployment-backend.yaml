apiVersion: apps/v1
kind: Deployment
metadata:
  name: capi-platform-backend
  namespace: capi-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: capi-platform-backend
  template:
    metadata:
      labels:
        app: capi-platform-backend
    spec:
      serviceAccountName: capi-platform
      imagePullSecrets:
        - name: gitlab-registry
      containers:
        - name: backend
          image: git.systalink.fr:5050/mouhmedsn02/capi_platform_v2/capi-platform-backend:vxlan-20261025b
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: capi-platform-config
            - secretRef:
                name: capi-platform-secret
          env:
            # Réseau des clusters créés (ne JAMAIS utiliser 192.x.x.x)
            - name: POD_CIDR
              value: "100.64.0.0/16"
            - name: SERVICE_CIDR
              value: "10.96.0.0/12"
            # Calico : VXLAN encapsulé (IPIP interdit par l'anti-spoofing OpenStack)
            - name: CALICO_IPIP_MODE
              value: "Never"
            - name: CALICO_VXLAN_MODE
              value: "Always"
            # 0 = auto (MTU underlay - 50 en VXLAN)
            - name: CALICO_MTU
              value: "0"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
