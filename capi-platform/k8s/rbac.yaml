apiVersion: v1
kind: ServiceAccount
metadata:
  name: capi-platform
  namespace: capi-platform
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: capi-platform-role
rules:
  - apiGroups: ["cluster.x-k8s.io","infrastructure.cluster.x-k8s.io",
                "bootstrap.cluster.x-k8s.io","controlplane.cluster.x-k8s.io",
                "ipam.cluster.x-k8s.io"]
    resources: ["*"]
    verbs: ["get","list","watch","create","update","patch","delete"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get","list","watch","create"]
  # secrets : lecture (kubeconfig) + écriture (secret clouds.yaml par tenant)
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get","list","watch","create","update","patch","delete"]
  - apiGroups: [""]
    resources: ["events","nodes","pods"]
    verbs: ["get","list","watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: capi-platform-binding
subjects:
  - kind: ServiceAccount
    name: capi-platform
    namespace: capi-platform
roleRef:
  kind: ClusterRole
  name: capi-platform-role
  apiGroup: rbac.authorization.k8s.io
