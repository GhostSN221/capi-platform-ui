apiVersion: v1
kind: Service
metadata:
  name: capi-platform-backend
  namespace: capi-platform
spec:
  type: NodePort
  selector:
    app: capi-platform-backend
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30800
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: capi-platform
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: capi-platform
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
