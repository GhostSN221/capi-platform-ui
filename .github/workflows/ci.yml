name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: capi-platform/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: capi-platform/backend/requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Syntax check
        run: python -m compileall -q app tests
      - name: Tests and core coverage
        run: |
          pytest -q \
            --cov=app.services.network \
            --cov=app.schemas \
            --cov=app.services.auth \
            --cov=app.services.demo \
            --cov-report=term-missing

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t capi-platform-backend:ci ./capi-platform/backend

  demo-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: capi-platform
    steps:
      - uses: actions/checkout@v4
      - name: Start demo stack
        run: docker compose -f docker-compose.demo.yml up -d --build
      - name: Wait for the demo, log in and read clusters
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8001/healthz; then break; fi
            sleep 2
          done
          curl -fsS http://localhost:8001/healthz
          TOKEN=$(curl -fsS -X POST http://localhost:8001/api/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"username":"demo","password":"demo"}' \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["access_token"])')
          curl -fsS http://localhost:8001/api/clusters/ \
            -H "Authorization: Bearer $TOKEN" \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); assert {c["name"] for c in d} == {"demo-prod","demo-staging","demo-dev"}, d'
      - name: Stop demo stack
        if: always()
        run: docker compose -f docker-compose.demo.yml down -v

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Kubernetes manifests
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          ./kubeconform -summary -strict capi-platform/k8s
